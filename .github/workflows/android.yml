name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: 构建 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 定位并准备 Android SDK
        shell: bash
        run: |
          set -o pipefail
          {
            echo "===== 环境探测 ====="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "JAVA_HOME=$JAVA_HOME"
          } 2>&1 | tee -a build-log.txt

          SDK_DIR=""
          for cand in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
            if [ -n "$cand" ] && [ -d "$cand" ]; then SDK_DIR="$cand"; break; fi
          done
          echo "解析到的 SDK 目录: [$SDK_DIR]" | tee -a build-log.txt
          if [ -z "$SDK_DIR" ]; then
            echo "错误：未找到 Android SDK 目录" | tee -a build-log.txt
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          ls -la "$SDK_DIR" 2>&1 | tee -a build-log.txt

          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          echo "sdkmanager=[$SDKMANAGER]" | tee -a build-log.txt
          if [ -z "$SDKMANAGER" ]; then
            echo "错误：未找到 sdkmanager" | tee -a build-log.txt
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tee -a build-log.txt

      - name: 安装 Gradle 8.7
        shell: bash
        run: |
          set -o pipefail
          curl -sSL -o gradle-dist.zip "https://services.gradle.org/distributions/gradle-8.7-bin.zip" 2>&1 | tee -a build-log.txt
          mkdir -p "$HOME/gradle-dist"
          unzip -q gradle-dist.zip -d "$HOME/gradle-dist" 2>&1 | tee -a build-log.txt
          echo "$HOME/gradle-dist/gradle-8.7/bin" >> "$GITHUB_PATH"
          "$HOME/gradle-dist/gradle-8.7/bin/gradle" --version 2>&1 | tee -a build-log.txt

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/notifications
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 构建 Debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee -a build-log.txt

      - name: 上传 APK 为构建产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 创建 Release 并附 APK 直链
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 自动构建 v1.0.${{ github.run_number }}
          body: |
            由 GitHub Actions 云端构建产出的 Debug APK。

            - 提交：${{ github.sha }}
            - 触发方式：${{ github.event_name }}
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false

      - name: 构建失败时把日志写入 Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('build-log.txt', 'utf8');
            } catch (err) {
              try {
                const files = fs.readdirSync('.');
                log = '未找到 build-log.txt（' + err.message + '）。工作目录内容：\n' + files.join('\n');
              } catch (e2) {
                log = '未找到 build-log.txt，且无法列出目录：' + err.message;
              }
            }
            const lines = log.split('\n');
            let tail = lines.slice(-500).join('\n');
            if (tail.length > 60000) {
              tail = tail.slice(tail.length - 60000);
            }
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const body = [
              'Android 构建失败，以下为日志末尾内容（最多 500 行）：',
              '',
              '```',
              tail,
              '```',
              '',
              '工作流运行：' + runUrl
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CI 构建失败 - run ' + context.runNumber,
              body: body
            });